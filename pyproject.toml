[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "junkscleaner"
version = "0.1.0"
description = "Lightweight, transparent system maintenance and monitoring desktop application"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Pending" }
authors = [
    { name = "JunksCleaner Contributors" }
]
keywords = ["system-maintenance", "cleanup", "monitoring", "cross-platform", "pyside6"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    # GUI dependency for M3+, will be installed when building the application
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.3",
    "mypy>=1.9",
    "cmake>=3.24",
    "ninja>=1.11",
]

[tool.setuptools.packages.find]
where = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".venv",
    "build",
    "JunksCleaner-v2.0",
    "Junks-Cleaner-CLI",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = []

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["app"]
addopts = "-ra -q --strict-markers"
filterwarnings = [
    "error",
]
